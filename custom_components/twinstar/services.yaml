send_command:
  fields:
    entity_id:
      required: false
      selector:
        entity:
          domain: light
          integration: twinstar
    command:
      required: true
      selector:
        text:

send_sequence:
  fields:
    entity_id:
      required: false
      selector:
        entity:
          domain: light
          integration: twinstar
    commands:
      required: true
      selector:
        object:
    delay:
      default: 1
      required: false
      selector:
        number:
          min: 0.1
          max: 10
          step: 0.1

set_schedule:
  fields:
    entity_id:
      required: false
      selector:
        entity:
          domain: light
          integration: twinstar
    start_time:
      required: true
      selector:
        time:
    end_time:
      required: true
      selector:
        time:
    sunrise_minutes:
      default: 30
      required: false
      selector:
        number:
          min: 0
          max: 60
          step: 1
    sunset_minutes:
      default: 30
      required: false
      selector:
        number:
          min: 0
          max: 60
          step: 1